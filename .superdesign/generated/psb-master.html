<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penerimaan Santri Baru Ma'had An-Najah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500&amp;f[]=satoshi@500,400&amp;display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Satoshi', sans-serif;
    }
    .font-display {
      font-family: 'Cabinet Grotesk', sans-serif;
    }
  </style>
</head>
<body>
  <div class="w-full h-screen overflow-hidden relative bg-slate-900 flex flex-col" data-sd-id="1">
    
    <!-- Background Texture/Gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-teal-900/40 via-slate-900 to-slate-950 z-0" data-sd-id="2"></div>
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+')] opacity-20 z-0 mix-blend-overlay" data-sd-id="3"></div>

    <!-- Main Content Area -->
    <div class="relative z-10 flex-1 flex flex-col justify-between p-12" data-sd-id="4">
      
      <!-- Header: Logo & Year -->
      <div class="flex justify-between items-start" data-sd-id="5">
        <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/a88c51c9-3bfb-4863-9718-6d0b1311f30b/brand-assets/brand-an-najah-official-logo/ChatGPT_Image_Sep_17__2026__08_28_22_PM.png" alt="Ma'had An-Najah Logo" class="w-32 object-contain drop-shadow-xl" data-sd-id="6">
        <div class="text-right" data-sd-id="7">
          <span class="font-display font-extrabold text-teal-400 text-3xl tracking-tight uppercase block" data-sd-id="8">
            Tahun Ajaran
          </span>
          <span class="font-display font-extrabold text-white text-5xl tracking-tighter" data-sd-id="9">
            2027/2028
          </span>
        </div>
      </div>

      <!-- Central Key Visual & Typography -->
      <div class="relative flex-1 flex items-center justify-center mt-8 mb-4" data-sd-id="10">
        <!-- The Image -->
        <div class="absolute inset-0 flex justify-center items-center opacity-80" data-sd-id="11">
           <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/a88c51c9-3bfb-4863-9718-6d0b1311f30b/content-assets/graphic-psb-2027-santriwati-key-visual/psb-santriwati-key-visual.png" alt="Santriwati An-Najah" class="max-h-[85%] object-contain drop-shadow-2xl mix-blend-luminosity brightness-110 contrast-125" data-sd-id="12">
        </div>
        
        <!-- Big Type Overlay -->
        <div class="relative z-20 text-center w-full" data-sd-id="13">
          <h1 class="font-display font-extrabold text-[8rem] leading-[0.8] tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white via-white to-white/60 drop-shadow-lg uppercase" data-sd-id="14">
            Penerimaan<br>
            <span class="text-teal-400" data-sd-id="15">Santri Baru</span>
          </h1>
          <p class="mt-6 font-medium text-slate-300 text-2xl tracking-wide max-w-2xl mx-auto drop-shadow" data-sd-id="16">
            Mencetak generasi muslimah yang berakhlak mulia, mandiri, dan berwawasan luas.
          </p>
        </div>
      </div>

      <!-- Footer: CTA & QR -->
      <div class="flex items-center justify-between bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-6" data-sd-id="17">
        <div class="flex-1 pr-6" data-sd-id="18">
          <h2 class="font-display font-extrabold text-white text-4xl mb-2 tracking-tight" data-sd-id="19">
            Daftar Sekarang
          </h2>
          <p class="text-slate-400 text-lg" data-sd-id="20">
            Scan QR code atau kunjungi website resmi kami untuk informasi pendaftaran lebih lanjut.
          </p>
          <div class="mt-4 inline-block bg-teal-500 text-slate-900 font-bold px-6 py-3 rounded-full text-lg" data-sd-id="21">
            psb.annajahbatam.sch.id
          </div>
        </div>
        <div class="bg-white p-3 rounded-2xl shrink-0" data-sd-id="22">
          <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/a88c51c9-3bfb-4863-9718-6d0b1311f30b/content-assets/graphic-psb-2027-registration-qr/psb-qr-website.png" alt="QR Code Pendaftaran" class="w-32 h-32 object-contain" data-sd-id="23">
        </div>
      </div>

    </div>
  </div>

</body></html>
